name: docker-publish

# The code release pipeline: every merge to main publishes an image. There is
# no CD pipeline; deploying is done by hand from the README.
on:
  push:
    branches: [main]

# One publish at a time. A newer run waits for the running one instead of
# racing it, so `latest` can never be moved back to an older commit.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Resolves to "<owner>/<repo>", i.e. isaiahduncan/skydra.
  IMAGE_NAME: ${{ github.repository }}

# contents: read  - lets actions/checkout clone the repo
# packages: write - lets us push images to GHCR with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  test:
    # Never publish an image from a commit whose tests fail.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short-sha> and latest, plus OCI labels (source, revision).
      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
