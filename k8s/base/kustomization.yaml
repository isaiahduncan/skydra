apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

# The generator appends a content hash to the ConfigMap name and rewrites the
# Deployment's reference to it, so a config change rolls the pod by itself.
configMapGenerator:
  - name: skydra-config
    envs:
      - skydra.env

labels:
  - pairs:
      app.kubernetes.io/name: skydra
      app.kubernetes.io/part-of: skydra
    includeSelectors: false
